function toISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function fromISO(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function md(d) {
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

/* 開始日から試験日までを weight の比で区切る */
function sprintSchedule(startISO) {
  const start = startISO ? fromISO(startISO) : new Date();
  start.setHours(0, 0, 0, 0);
  const totalDays = Math.max(SPRINT.length, daysBetween(start, EXAM) + 1);
  const totalWeight = SPRINT.reduce((s, x) => s + x.weight, 0);
  /* 累積比で区切る。ステップごとに丸めると誤差が溜まって
     最後の直前期が1日に潰れるため、境界そのものを丸める。 */
  let acc = 0;
  let cursor = 0;
  return SPRINT.map((s, i) => {
    acc += s.weight;
    const bound =
      i === SPRINT.length - 1 ? totalDays : Math.round((totalDays * acc) / totalWeight);
    const end = Math.max(cursor, Math.min(bound, totalDays) - 1);
    const from = new Date(start.getFullYear(), start.getMonth(), start.getDate() + cursor);
    const to = new Date(start.getFullYear(), start.getMonth(), start.getDate() + end);
    cursor = end + 1;
    return { ...s, from, to };
  });
}

function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}

function DayGrid() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const total = daysBetween(START, EXAM) + 1;
  const cells = [];
  for (let i = 0; i < START.getDay(); i++) cells.push(null);
  for (let i = 0; i < total; i++) {
    const d = new Date(START.getFullYear(), START.getMonth(), START.getDate() + i);
    cells.push(d);
  }
  return (
    <div
      className="grid gap-1"
      style={{ gridTemplateColumns: "repeat(7, 1fr)", maxWidth: 240, margin: "0 auto" }}
      aria-label="試験日までの日割り"
    >
      {cells.map((d, i) => {
        if (!d) return <div key={i} />;
        const isExam = d.getTime() === EXAM.getTime();
        const isToday = d.getTime() === today.getTime();
        const past = d < today;
        return (
          <div
            key={i}
            title={`${d.getMonth() + 1}/${d.getDate()}`}
            style={{
              aspectRatio: "1 / 1",
              borderRadius: 1,
              border: `1px solid ${isExam ? T.seal : T.line}`,
              background: isExam
                ? T.seal
                : isToday
                ? T.ink
                : past
                ? T.faint
                : "transparent",
            }}
          />
        );
      })}
    </div>
  );
}

function Bar({ value, tone }) {
  return (
    <div style={{ height: 4, background: T.faint, borderRadius: 2 }}>
      <div
        style={{
          height: 4,
          width: `${Math.round(value * 100)}%`,
          background: tone || T.ink,
          borderRadius: 2,
          transition: "width .3s ease",
        }}
      />
    </div>
  );
}

function TakkenLedger() {
  const [tab, setTab] = useState("plan");
  const [done, setDone] = useState({});
  const [stats, setStats] = useState({});
  const [mode, setMode] = useState("sprint");
  const [sprintStart, setSprintStart] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [saveNote, setSaveNote] = useState("");

  useEffect(() => {
    (async () => {
      let v = {};
      try {
        const r = await window.storage.get("takken:v1");
        if (r && r.value) v = JSON.parse(r.value) || {};
      } catch (e) {
        /* 初回は記録なし */
      }
      setDone(v.done || {});
      setStats(v.stats || {});
      setMode(v.mode === "standard" ? "standard" : "sprint");
      setSprintStart(v.sprintStart || toISO(new Date()));
      setLoaded(true);
    })();
  }, []);

  const persist = useCallback(async (next) => {
    try {
      await window.storage.set("takken:v1", JSON.stringify(next));
      setSaveNote("");
    } catch (e) {
      setSaveNote("保存できませんでした。通信を確認して、もう一度操作してください。");
    }
  }, []);

  const snapshot = { done, stats, mode, sprintStart };

  const toggle = (key) => {
    const next = { ...done, [key]: !done[key] };
    setDone(next);
    persist({ ...snapshot, done: next });
  };

  const record = (qid, area, correct) => {
    const cur = stats[qid] || { o: 0, x: 0, area };
    const next = {
      ...stats,
      [qid]: { ...cur, area, o: cur.o + (correct ? 1 : 0), x: cur.x + (correct ? 0 : 1) },
    };
    setStats(next);
    persist({ ...snapshot, stats: next });
  };

  const changeMode = (m) => {
    setMode(m);
    persist({ ...snapshot, mode: m });
  };

  const restartSprint = () => {
    const iso = toISO(new Date());
    setSprintStart(iso);
    persist({ ...snapshot, sprintStart: iso });
  };

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const left = Math.max(0, daysBetween(today, EXAM));

  const schedule = useMemo(() => sprintSchedule(sprintStart), [sprintStart]);

  const allTasks = useMemo(
    () =>
      mode === "sprint"
        ? SPRINT.flatMap((s) => s.tasks.map((_, i) => `${s.id}-${i}`))
        : PHASES.flatMap((p) => p.weeks.flatMap((w) => w.tasks.map((_, i) => `${w.id}-${i}`))),
    [mode]
  );
  const doneCount = allTasks.filter((k) => done[k]).length;

  const currentPhase = useMemo(() => {
    const bounds = [
      new Date(2026, 7, 24),
      new Date(2026, 8, 14),
      new Date(2026, 9, 5),
    ];
    if (today < bounds[0]) return 0;
    if (today < bounds[1]) return 1;
    if (today < bounds[2]) return 2;
    return 3;
  }, [today]);

  const currentStep = useMemo(() => {
    const i = schedule.findIndex((s) => today <= s.to);
    return i === -1 ? schedule.length - 1 : i;
  }, [schedule, today.getTime()]);

  return (
    <div
      style={{
        background: T.paper,
        color: T.ink,
        fontFamily: F.body,
        minHeight: "100vh",
        backgroundImage: `linear-gradient(${T.line}22 1px, transparent 1px), linear-gradient(90deg, ${T.line}22 1px, transparent 1px)`,
        backgroundSize: "22px 22px",
      }}
    >
      <div className="mx-auto px-4 py-6" style={{ maxWidth: 560 }}>
        {/* 見出し */}
        <div className="flex items-end justify-between">
          <div>
            <div style={{ fontSize: 11, letterSpacing: ".18em", color: T.sub }}>
              宅地建物取引士資格試験
            </div>
            <div style={{ fontFamily: F.disp, fontSize: 26, lineHeight: 1.2 }}>
              2026年10月18日
            </div>
          </div>
          <div className="text-right">
            <div style={{ fontFamily: F.num, fontSize: 40, lineHeight: 1, color: T.seal }}>
              {left}
            </div>
            <div style={{ fontSize: 11, color: T.sub }}>日</div>
          </div>
        </div>

        <div className="mt-4">
          <DayGrid />
        </div>

        <div
          className="mt-3 flex items-center justify-between"
          style={{ fontSize: 12, color: T.sub }}
        >
          <span style={{ fontFamily: F.disp, color: T.ink }}>
            {mode === "sprint" ? schedule[currentStep].title : PHASES[currentPhase].name}
          </span>
          <span style={{ fontFamily: F.num }}>
            {doneCount}/{allTasks.length} 項目
          </span>
        </div>

        {/* タブ */}
        <div className="mt-5 flex gap-1">
          {[
            ["plan", "計画"],
            ["quiz", "一問一答"],
            ["log", "記録"],
          ].map(([k, label]) => (
            <button
              key={k}
              onClick={() => setTab(k)}
              className="flex-1 py-2"
              style={{
                fontFamily: F.disp,
                fontSize: 14,
                letterSpacing: ".08em",
                border: `1px solid ${tab === k ? T.ink : T.line}`,
                background: tab === k ? T.ink : "transparent",
                color: tab === k ? T.card : T.sub,
                borderRadius: 2,
              }}
            >
              {label}
            </button>
          ))}
        </div>

        {saveNote && (
          <div className="mt-3 p-2" style={{ fontSize: 12, color: T.seal, border: `1px solid ${T.seal}` }}>
            {saveNote}
          </div>
        )}

        {!loaded ? (
          <div className="mt-8 text-center" style={{ color: T.sub, fontSize: 13 }}>
            記録を読み込んでいます…
          </div>
        ) : tab === "plan" ? (
          <Plan
            done={done}
            toggle={toggle}
            current={currentPhase}
            mode={mode}
            changeMode={changeMode}
            schedule={schedule}
            currentStep={currentStep}
            sprintStart={sprintStart}
            restartSprint={restartSprint}
          />
        ) : tab === "quiz" ? (
          <Quiz stats={stats} record={record} />
        ) : (
          <Log stats={stats} done={done} allTasks={allTasks} />
        )}

        <div className="mt-8" style={{ fontSize: 11, color: T.sub, lineHeight: 1.7 }}>
          出題は本試験の形式に合わせた自作問題です。法改正は毎年入るので、直前期に最新のテキストで数字を突き合わせてください。
        </div>
      </div>
    </div>
  );
}

    <button onClick={() => toggle(id)} className="mt-2 flex w-full items-start gap-2 text-left">

        style={{
          flexShrink: 0,
          width: 15,
          height: 15,
          marginTop: 2,
          borderRadius: 1,
          border: `1px solid ${on ? T.ink : T.line}`,
          background: on ? T.ink : "transparent",
          color: T.card,
          fontSize: 10,
          lineHeight: "14px",
          textAlign: "center",
        }}
      >
        {on ? "✓" : ""}
      </span>
      <span
        style={{
          fontSize: 13.5,
          lineHeight: 1.6,
          color: on ? T.sub : T.ink,
          textDecoration: on ? "line-through" : "none",
        }}
      >
        {label}

    </button>
  );
}

}

function Standard({ done, toggle, current }) {
  return (
    <div className="mt-4">
      {PHASES.map((p, pi) => (
        <div key={p.name} className="mb-6">
          <div
            className="flex items-baseline justify-between pb-1"
            style={{ borderBottom: `1px solid ${pi === current ? T.seal : T.line}` }}
          >
            <span style={{ fontFamily: F.disp, fontSize: 16 }}>{p.name}</span>
            <span style={{ fontFamily: F.num, fontSize: 11, color: T.sub }}>{p.span}</span>
          </div>
          <div className="mt-2" style={{ fontSize: 12, color: T.sub }}>
            {p.aim}
          </div>
          {p.weeks.map((w) => (
            <div
              key={w.id}
              className="mt-3 p-3"
              style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 2 }}
            >
              <div style={{ fontFamily: F.num, fontSize: 11, color: T.sub, letterSpacing: ".05em" }}>
                {w.label}
              </div>
              {w.tasks.map((t, i) => (
                <TaskRow key={i} id={`${w.id}-${i}`} label={t} done={done} toggle={toggle} />
              ))}
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

function Quiz({ stats, record }) {
  const [area, setArea] = useState("all");
  const [wrongOnly, setWrongOnly] = useState(false);
  const [i, setI] = useState(0);
  const [picked, setPicked] = useState(null);

  const pool = useMemo(() => {
    let p = Q.filter((q) => area === "all" || q.a === area);
    if (wrongOnly) p = p.filter((q) => stats[q.id] && stats[q.id].x > 0);
    return p;
  }, [area, wrongOnly, stats]);

  useEffect(() => {
    setI(0);
    setPicked(null);
  }, [area, wrongOnly]);

  if (pool.length === 0) {
    return (
      <div className="mt-6">
        <AreaFilter area={area} setArea={setArea} wrongOnly={wrongOnly} setWrongOnly={setWrongOnly} />
        <div className="mt-8 text-center" style={{ fontSize: 13, color: T.sub, lineHeight: 1.8 }}>
          間違えた問題はまだありません。
          <br />
          絞り込みを外して解き始めてください。
        </div>
      </div>
    );
  }

  const q = pool[Math.min(i, pool.length - 1)];
  const answered = picked !== null;
  const correct = answered && picked === q.ans;

  const choose = (v) => {
    if (answered) return;
    setPicked(v);
    record(q.id, q.a, v === q.ans);
  };

  const next = () => {
    setPicked(null);
    setI((n) => (n + 1) % pool.length);
  };

  return (
    <div className="mt-5">
      <AreaFilter area={area} setArea={setArea} wrongOnly={wrongOnly} setWrongOnly={setWrongOnly} />

      <div
        className="mt-4 p-4"
        style={{ background: T.card, border: `1px solid ${T.line}`, borderRadius: 2 }}
      >
        <div className="flex justify-between" style={{ fontFamily: F.num, fontSize: 11, color: T.sub }}>
          <span>{AREAS.find((x) => x.key === q.a).label}</span>
          <span>
            {Math.min(i, pool.length - 1) + 1} / {pool.length}
          </span>
        </div>
        <div style={{ fontSize: 15, lineHeight: 1.85, marginTop: 10, fontFamily: F.disp }}>
          {q.t}
        </div>

        <div className="mt-4 flex gap-2">
          {[
            [true, "○ 正しい"],
            [false, "× 誤り"],
          ].map(([v, label]) => {
            const chosen = picked === v;
            const isAns = q.ans === v;
            let bg = "transparent",
              bd = T.line,
              fg = T.ink;
            if (answered) {
              if (isAns) {
                bg = T.ok;
                bd = T.ok;
                fg = "#fff";
              } else if (chosen) {
                bg = T.seal;
                bd = T.seal;
                fg = "#fff";
              } else {
                fg = T.sub;
              }
            }
            return (
              <button
                key={String(v)}
                onClick={() => choose(v)}
                className="flex-1 py-3"
                style={{
                  border: `1px solid ${bd}`,
                  background: bg,
                  color: fg,
                  borderRadius: 2,
                  fontSize: 14,
                  fontFamily: F.disp,
                }}
              >
                {label}
              </button>
            );
          })}
        </div>

        {answered && (
          <div className="mt-4">
            <div
              style={{
                fontFamily: F.disp,
                fontSize: 14,
                color: correct ? T.ok : T.seal,
              }}
            >
              {correct ? "正解" : "不正解"}
            </div>
            <div style={{ fontSize: 13, lineHeight: 1.8, marginTop: 6 }}>{q.e}</div>
            <button
              onClick={next}
              className="mt-4 w-full py-3"
              style={{
                background: T.ink,
                color: T.card,
                borderRadius: 2,
                fontSize: 14,
                fontFamily: F.disp,
                letterSpacing: ".08em",
              }}
            >
              次の問題へ
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function AreaFilter({ area, setArea, wrongOnly, setWrongOnly }) {
  return (
    <div>
      <div className="flex flex-wrap gap-1">
        {[{ key: "all", label: "全分野" }, ...AREAS].map((a) => (
          <button
            key={a.key}
            onClick={() => setArea(a.key)}
            className="px-2 py-1"
            style={{
              fontSize: 12,
              border: `1px solid ${area === a.key ? T.ink : T.line}`,
              background: area === a.key ? T.ink : "transparent",
              color: area === a.key ? T.card : T.sub,
              borderRadius: 2,
            }}
          >
            {a.label}
          </button>
        ))}
      </div>
      <button
        onClick={() => setWrongOnly(!wrongOnly)}
        className="mt-2 px-2 py-1"
        style={{
          fontSize: 12,
          border: `1px solid ${wrongOnly ? T.seal : T.line}`,
          color: wrongOnly ? T.seal : T.sub,
          borderRadius: 2,
        }}
      >
        {wrongOnly ? "間違えた問題のみ表示中" : "間違えた問題だけ解く"}
      </button>
    </div>
  );
}

function Log({ stats, done, allTasks }) {
  const rows = AREAS.map((a) => {
    const ids = Q.filter((q) => q.a === a.key).map((q) => q.id);
    let o = 0,
      x = 0;
    ids.forEach((id) => {
      if (stats[id]) {
        o += stats[id].o;
        x += stats[id].x;
      }
    });
    const total = o + x;
    return { ...a, o, x, rate: total ? o / total : 0, total };
  });
  const doneCount = allTasks.filter((k) => done[k]).length;

  return (
    <div className="mt-5">
      <div style={{ fontFamily: F.disp, fontSize: 16, borderBottom: `1px solid ${T.line}`, paddingBottom: 4 }}>
        分野別の正答率
      </div>
      {rows.map((r) => (
        <div key={r.key} className="mt-4">
          <div className="flex items-baseline justify-between">
            <span style={{ fontSize: 13 }}>{r.label}</span>
            <span style={{ fontFamily: F.num, fontSize: 12, color: T.sub }}>
              {r.total ? `${Math.round(r.rate * 100)}%` : "未着手"}　目標 {r.goal}
            </span>
          </div>
          <div className="mt-1">
            <Bar value={r.rate} tone={r.rate >= 0.8 ? T.ok : r.rate >= 0.6 ? T.ink : T.seal} />
          </div>
          <div style={{ fontFamily: F.num, fontSize: 11, color: T.sub, marginTop: 3 }}>
            {r.o} 正 / {r.x} 誤
          </div>
        </div>
      ))}

      <div
        className="mt-7"
        style={{ fontFamily: F.disp, fontSize: 16, borderBottom: `1px solid ${T.line}`, paddingBottom: 4 }}
      >
        計画の消化
      </div>
      <div className="mt-3">
        <Bar value={allTasks.length ? doneCount / allTasks.length : 0} />
      </div>
      <div style={{ fontFamily: F.num, fontSize: 12, color: T.sub, marginTop: 4 }}>
        {doneCount} / {allTasks.length} 項目
      </div>

      <div className="mt-6 p-3" style={{ background: T.card, border: `1px solid ${T.line}`, fontSize: 12.5, lineHeight: 1.9 }}>
        合格ラインは年によって34〜38点。短期集中プランでは、業法19／法令7／税その他7／権利8の計41点を狙います。合格ラインちょうどを目標にすると当日の1問が命取りになるので、業法と法令で先に貯金を作り、権利関係には深入りしません。
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TakkenLedger />);
</script>
</body>
